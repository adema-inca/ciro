<title>Ciro Krauthausen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Tarjeta vertical de firma personal: el nombre manda, la marca del centro
     queda como nota al margen, datos copiables y acciones al pie. */
  :root {
    --bg: #E9EFF3;
    --card: #FFFFFF;
    --ink: #0B1E2D;
    --muted: #5C7183;
    --brand: #023764;
    --brand-ink: #FFFFFF;
    --accent: #00808A;
    --accent-soft: #E2F3F4;
    --line: #DBE4EB;
    --btn-bg: #023764;
    --btn-fg: #FFFFFF;
    --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
    --font-ui: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #06111C;
      --card: #0E2133;
      --ink: #E9F1F6;
      --muted: #94AABB;
      --brand: #0B2D4D;
      --brand-ink: #EAF3FA;
      --accent: #38CBD8;
      --accent-soft: #10303C;
      --line: #1D3448;
      --btn-bg: #38CBD8;
      --btn-fg: #06111C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #06111C;
    --card: #0E2133;
    --ink: #E9F1F6;
    --muted: #94AABB;
    --brand: #0B2D4D;
    --brand-ink: #EAF3FA;
    --accent: #38CBD8;
    --accent-soft: #10303C;
    --line: #1D3448;
    --btn-bg: #38CBD8;
    --btn-fg: #06111C;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding-block: 40px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(2, 55, 100, .06), 0 18px 40px -24px rgba(2, 55, 100, .35);
  }

  /* --- cabecera: Ciro primero, la marca del centro al margen --- */
  .head {
    padding: 26px 26px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .avatar {
    width: 96px;
    height: 96px;
    max-width: 100%;
    flex: none;
    border-radius: 50%;
    display: block;
    border: 1px solid var(--line);
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 7px;
    padding-top: 7px;
    color: var(--muted);
    min-width: 0;
  }
  .mark svg { width: 16px; height: auto; flex: none; }
  .mark .org { min-width: 0; }
  .mark .org b {
    display: block;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
  }
  .mark .org span {
    display: block;
    font-size: 10px;
    letter-spacing: .03em;
  }

  .names { display: flex; flex-direction: column; gap: 6px; }
  h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 31px;
    line-height: 1.1;
    letter-spacing: -.015em;
    margin: 0;
    text-wrap: balance;
  }
  .role {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.45;
    color: var(--ink);
  }
  .inst {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* --- filas de contacto --- */
  .rows { border-top: 1px solid var(--line); }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 26px;
    border-bottom: 1px solid var(--line);
  }
  .row .field { flex: 1 1 auto; min-width: 0; }
  .row .label {
    display: block;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .row .value {
    font-size: 15px;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .row a.value { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .row a.value:hover { border-bottom-color: var(--accent); }
  .row .value.num { font-variant-numeric: tabular-nums; letter-spacing: .02em; }

  button.copy {
    flex: none;
    margin-top: 2px;
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 5px 10px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button.copy:hover { background: var(--accent-soft); border-color: var(--accent); }
  button.copy[data-done="1"] { background: var(--accent-soft); border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- pie: acciones --- */
  .foot {
    padding: 20px 26px 26px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    flex: 1 1 150px;
    min-width: 0;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    border-radius: 9px;
    padding: 12px 16px;
    text-decoration: none;
    border: 1px solid;
    transition: filter .15s, background .15s, border-color .15s;
  }
  .btn-main {
    background: var(--btn-bg);
    border-color: var(--btn-bg);
    color: var(--btn-fg);
  }
  .btn-main:hover { filter: brightness(1.12); }
  .btn-ghost {
    background: transparent;
    border-color: var(--line);
    color: var(--ink);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 400px) {
    .head, .row, .foot { padding-left: 18px; padding-right: 18px; }
    h1 { font-size: 27px; }
    .foot { gap: 16px; }
  }
</style>

      <button class="copy" type="button" data-copy="Carrer des Tren, 72, 07300 Inca, Illes Balears">Copiar</button>
    </div>
  </div>

  <div class="foot">
    <a class="btn btn-main" href="ciro.vcf" type="text/vcard" download="Ciro Krauthausen.vcf">Guardar contacto</a>
    <a class="btn btn-ghost" href="https://www.linkedin.com/in/ciro-krauthausen-0988bb37/" target="_blank" rel="noopener">Ver en LinkedIn</a>
  </div>
</main>

<script>
  document.querySelectorAll("button.copy").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var text = btn.getAttribute("data-copy") || "";
      var mark = function () {
        var prev = btn.textContent;
        btn.textContent = "Copiado";
        btn.setAttribute("data-done", "1");
        setTimeout(function () {
          btn.textContent = prev;
          btn.removeAttribute("data-done");
        }, 1600);
      };
      var fallback = function () {
        var node = btn.parentElement.querySelector(".value");
        if (!node) return;
        var range = document.createRange();
        range.selectNodeContents(node);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        btn.textContent = "Selecciona y copia";
        setTimeout(function () { btn.textContent = "Copiar"; }, 2600);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(mark, fallback);
        } else {
          fallback();
        }
      } catch (e) {
        fallback();
      }
    });
  });
</script>
